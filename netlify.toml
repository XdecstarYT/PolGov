# Netlify deployment.
#
# Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY in the site's
# environment variables to enable accounts and cloud saves. With neither set
# the game still builds and plays, saving to localStorage.
#
# Never add GROQ_API_KEY here. Anything the build can read can end up in the
# bundle; the Groq key belongs only in Supabase's secret store.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: the client routes on state, not URLs, so every path serves
# the same document.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
